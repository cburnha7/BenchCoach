# Builds & signs Bench Coach on a GitHub cloud Mac using ONLY an App Store Connect
# API key (browser-generatable, no Mac, no certificate export). Xcode cloud-managed
# signing creates/downloads what it needs via -allowProvisioningUpdates.
#
# ADD THESE 3 SECRETS: repo > Settings > Secrets and variables > Actions
#   APPSTORE_KEY_ID          # the Key ID (e.g. 2X9R4H...)
#   APPSTORE_ISSUER_ID       # the Issuer ID (a UUID)
#   APPSTORE_API_PRIVATE_KEY # full contents of the AuthKey_XXXX.p8 file (paste it all)

name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    env:
      TEAM_ID: Z3KZY6682M
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform & sync web assets
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Generate app icon & splash
        run: npx capacitor-assets generate --ios || true

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          cat > ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 <<'KEY'
          ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          KEY

      - name: Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -archivePath "$PWD/build/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic \
            archive

      - name: Export IPA
        run: |
          cd ios/App
          cp ../../build-config/ExportOptions.plist ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$PWD/build/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$PWD/build" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }}

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ios/App/build/App.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
