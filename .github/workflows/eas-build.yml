name: EAS Build

# Manual-only: builds are run locally with `eas build`. The push trigger was
# removed so pushes don't fire a CI build that fails without an EXPO_TOKEN
# secret. To use CI builds, add EXPO_TOKEN in repo Settings → Secrets, then
# run this workflow from the Actions tab (Run workflow).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options: [all, ios, android]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      # EAS builds on Expo's macOS/Linux workers, so no Mac is needed here.
      - name: Build
        run: |
          eas build \
            --platform ${{ github.event.inputs.platform || 'all' }} \
            --profile production \
            --non-interactive \
            --no-wait
